volume=30
script-opts=ytdl_hook-ytdl_path=yt-dlp
hwdec=auto
osd-bar=no

[wonderboom-eq]
profile-cond=(function() local cur=get("audio-device",""); for _,d in ipairs(get("audio-device-list",{})) do if d.name==cur and d.description:find("WONDERBOOM 3",1,true) then return true end end return false end)()
af-add=@wonderboom:lavfi=[equalizer=f=95:t=q:w=1.4:g=-9,equalizer=f=165:t=q:w=1.0:g=-4,equalizer=f=250:t=q:w=1.0:g=-2]

[wonderboom-eq-off]
profile-cond=not (function() local cur=get("audio-device",""); for _,d in ipairs(get("audio-device-list",{})) do if d.name==cur and d.description:find("WONDERBOOM 3",1,true) then return true end end return false end)()
af-remove=@wonderboom

[stream-30s]
profile-desc=30 second resilient streaming buffer
cache=yes
cache-secs=30
cache-pause=yes
cache-pause-initial=yes
cache-pause-wait=30
demuxer-max-bytes=256MiB
demuxer-max-back-bytes=64MiB

[fast]
profile=fast
vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11
hwdec=auto
video-sync=audio
interpolation=no
deband=no
framedrop=vo
priority=normal
d3d11va-zero-copy=yes
